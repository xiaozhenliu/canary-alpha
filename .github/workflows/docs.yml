name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node 22 ships npm 10.x, which has a bug where `npm ci` treats
      # platform-specific optional deps (e.g. @rollup/rollup-freebsd-arm64)
      # as hard requirements and fails with EBADPLATFORM on linux/x64.
      # npm 11 fixes this. See npm/cli#4828.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run docs:build
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
