name: Bug report
description: Report a reproducible problem in canary-alpha-mcp
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Do not include sensitive screen content, tokens, or suspected security vulnerabilities. Report vulnerabilities through the private GitHub Security Advisory form instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release or commit are you using?
      placeholder: "2.0.1 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include macOS version, Node.js version, Screenpipe version, transport, and embedding provider when relevant.
      placeholder: |
        macOS:
        Node.js:
        Screenpipe:
        Transport:
        Embedding provider:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Run ...
        2. Call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or additional context
      description: Remove captured screen text, local file contents, tokens, and other private data before posting.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private screen content, local file contents, credentials, and tokens from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
